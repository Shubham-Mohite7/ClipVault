<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="End-to-end encrypted chat: Mia encrypts on her device, the server relays ciphertext, Sam decrypts on his device." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f5f5f7"/></linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".14"/></filter>
    <g id="key"><circle cx="-6" cy="0" r="5.5" fill="none" stroke="#fff" stroke-width="2.8"/><path d="M-1 0 H11 M7 0 V4.5 M11 0 V3.5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .line { animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -14; } }
    .send { animation: send 6s ease-in-out infinite both; }
    @keyframes send { 0% { opacity: 0; transform: translateY(8px); } 8%,90% { opacity: 1; transform: translateY(0); } 98%,100% { opacity: 0; } }
    .recv { animation: recv 6s ease-in-out infinite both; }
    @keyframes recv { 0%,68% { opacity: 0; transform: translateY(8px); } 76%,90% { opacity: 1; transform: translateY(0); } 98%,100% { opacity: 0; } }
    .pkt { animation: pkt 6s ease-in-out infinite both; }
    @keyframes pkt { 0%,13% { opacity: 0; } 17%,66% { opacity: 1; } 72%,100% { opacity: 0; } }
    .k { animation: ring 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ring { 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(2); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="1280" height="460" fill="url(#bg)"/>

  <text x="205" y="38" text-anchor="middle" font-size="20" font-weight="600" fill="#1d1d1f">Mia</text>
  <text x="1075" y="38" text-anchor="middle" font-size="20" font-weight="600" fill="#1d1d1f">Sam</text>

  <g fill="none" stroke="#c7c7cc" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 13">
    <path class="line" d="M296 210 H556"/><path class="line" d="M724 210 H984"/>
  </g>

  <g transform="translate(130,60)" filter="url(#shadow)">
    <rect width="150" height="300" rx="32" fill="#f2f2f7" stroke="#d1d1d6" stroke-width="4"/>
    <rect x="8" y="8" width="134" height="284" rx="25" fill="#ffffff"/>
    <rect x="45" y="16" width="60" height="14" rx="7" fill="#1d1d1f"/>
    <text x="75" y="58" text-anchor="middle" font-size="13" fill="#6e6e73">Sam</text>
    <g class="send"><rect x="18" y="84" width="114" height="38" rx="19" fill="#1a8cff"/><text x="75" y="108" text-anchor="middle" font-size="15" fill="#fff">Meet at 6?</text></g>
    <rect x="50" y="282" width="50" height="4" rx="2" fill="#d1d1d6"/>
  </g>
  <g transform="translate(1000,60)" filter="url(#shadow)">
    <rect width="150" height="300" rx="32" fill="#f2f2f7" stroke="#d1d1d6" stroke-width="4"/>
    <rect x="8" y="8" width="134" height="284" rx="25" fill="#ffffff"/>
    <rect x="45" y="16" width="60" height="14" rx="7" fill="#1d1d1f"/>
    <text x="75" y="58" text-anchor="middle" font-size="13" fill="#6e6e73">Mia</text>
    <g class="recv"><rect x="18" y="84" width="114" height="38" rx="19" fill="#f2f2f7"/><text x="75" y="108" text-anchor="middle" font-size="15" fill="#1d1d1f">Meet at 6?</text></g>
    <rect x="50" y="282" width="50" height="4" rx="2" fill="#d1d1d6"/>
  </g>

  <g transform="translate(205,396)"><circle class="k" r="19" fill="none" stroke="#2fa36b" stroke-width="3"/><circle r="19" fill="#2fa36b"/><use href="#key"/></g>
  <text x="205" y="438" text-anchor="middle" font-size="14" fill="#6e6e73">Mia's key</text>
  <g transform="translate(1075,396)"><circle class="k" style="animation-delay:1.5s" r="19" fill="none" stroke="#2fa36b" stroke-width="3"/><circle r="19" fill="#2fa36b"/><use href="#key"/></g>
  <text x="1075" y="438" text-anchor="middle" font-size="14" fill="#6e6e73">Sam's key</text>

  <g transform="translate(560,150)" filter="url(#shadow)">
    <g fill="#ffffff" stroke="#e5e5ea" stroke-width="2">
      <rect x="0" y="52" width="160" height="56" rx="28"/>
      <circle cx="58" cy="52" r="38"/>
      <circle cx="104" cy="44" r="46"/>
    </g>
    <rect x="22" y="44" width="116" height="60" fill="#ffffff"/>
  </g>
  <text x="640" y="300" text-anchor="middle" font-size="17" font-weight="600" fill="#1d1d1f">Server</text>
  <text x="640" y="324" text-anchor="middle" font-size="14" fill="#6e6e73">Only sees ciphertext</text>

  <g class="pkt">
    <g>
      <rect x="-50" y="-17" width="100" height="34" rx="17" fill="#1d1d1f"/>
      <rect x="-39" y="-3" width="10" height="9" rx="2" fill="#ffffff"/>
      <path d="M-37 -3 v-3 a3 3 0 0 1 6 0 v3" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      <text x="9" y="4" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ffffff">9f2a…c1</text>
    </g>
    <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.15;0.7;1" keyPoints="0;0;1;1" path="M296 210 H984"/>
  </g>
</svg>
