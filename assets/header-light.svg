<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="ClipVault. Your clipboard. Anywhere." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f5f5f7"/></linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity=".14"/></filter>
    
    <g id="key"><circle cx="-7" cy="0" r="6" fill="none" stroke="#fff" stroke-width="3"/><path d="M-1 0 H12 M8 0 V5 M12 0 V4" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .f1 { animation: float 7s ease-in-out infinite; }
    .f2 { animation: float 7s ease-in-out -3.5s infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .b { animation: pop 9s ease-in-out infinite both; }
    .b1 { animation-delay: .2s; } .b2 { animation-delay: 1.1s; } .b3 { animation-delay: 1.8s; }
    @keyframes pop { 0%,4% { opacity: 0; transform: translateY(10px); } 10%,88% { opacity: 1; transform: translateY(0); } 95%,100% { opacity: 0; transform: translateY(0); } }
    .k { animation: ring 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ring { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(2.1); opacity: 0; } }
    .d { animation: type 7s ease-in-out infinite both; }
    @keyframes type { 0%,4% { opacity: 0; } 9%,86% { opacity: 1; } 94%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1075" cy="330" r="270" fill="#ececf1" fill-opacity=".7"/>

  <g transform="translate(80,44) scale(0.0391)">
    <rect width="1024" height="1024" rx="230" fill="#000000" stroke="#000000" stroke-width="12"/>
    <path d="M612 400 V620 a100 100 0 0 1 -200 0 V360 a60 60 0 0 1 120 0 V560 a20 20 0 0 1 -40 0 V420" fill="none" stroke="#fff" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="512" cy="664" r="30" fill="#fff"/>
  </g>
  <text x="132" y="73" font-size="22" font-weight="600" letter-spacing="-0.4" fill="#1d1d1f">ClipVault</text>

  <text x="78" y="212" font-size="86" font-weight="700" letter-spacing="-3.5" fill="#1d1d1f">Your clipboard</text>
  <text x="78" y="300" font-size="86" font-weight="700" letter-spacing="-3.5" fill="#1d1d1f">Anywhere.</text>
  <text x="80" y="350" font-size="22" fill="#6e6e73" letter-spacing="-0.2">Save text, images, and PDFs. Open your vault</text>
  <text x="80" y="380" font-size="22" fill="#6e6e73" letter-spacing="-0.2">anywhere with a code. No account needed.</text>

  <rect x="80" y="414" width="168" height="50" rx="25" fill="#1d1d1f"/>
  <text x="164" y="445" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">Get my code</text>

  <text x="80" y="520" font-size="15" fill="#6e6e73">Already have a code?</text>
  <g fill="#ececf1">
    <rect x="80" y="534" width="48" height="48" rx="13"/><rect x="138" y="534" width="48" height="48" rx="13"/><rect x="196" y="534" width="48" height="48" rx="13"/>
    <rect x="280" y="534" width="48" height="48" rx="13"/><rect x="338" y="534" width="48" height="48" rx="13"/><rect x="396" y="534" width="48" height="48" rx="13"/>
  </g>
  <g font-size="23" font-weight="600" fill="#6e6e73" text-anchor="middle">
    <text class="d" style="animation-delay:.0s" x="104" y="566">A</text>
    <text class="d" style="animation-delay:.25s" x="162" y="566">A</text>
    <text class="d" style="animation-delay:.5s" x="220" y="566">A</text>
    <text x="262" y="564" fill="#aeaeb2">-</text>
    <text class="d" style="animation-delay:.75s" x="304" y="566">0</text>
    <text class="d" style="animation-delay:1s" x="362" y="566">0</text>
    <text class="d" style="animation-delay:1.25s" x="420" y="566">0</text>
  </g>

  <g class="f1"><g transform="translate(830,96) rotate(-4 95 210)" filter="url(#shadow)">
    <rect width="190" height="420" rx="40" fill="#f2f2f7" stroke="#d1d1d6" stroke-width="4"/>
    <rect x="10" y="10" width="170" height="400" rx="31" fill="#ffffff"/>
    <rect x="65" y="22" width="60" height="16" rx="8" fill="#1d1d1f"/>
    <text x="95" y="72" text-anchor="middle" font-size="14" fill="#6e6e73">Sam</text>
    <g class="b b1"><rect x="20" y="90" width="78" height="30" rx="15" fill="#f2f2f7"/><text x="59" y="110" text-anchor="middle" font-size="13" fill="#1d1d1f">Dinner?</text></g>
    <g class="b b2"><rect x="24" y="146" width="142" height="46" rx="23" fill="#1a8cff"/><text x="95" y="175" text-anchor="middle" font-size="17" fill="#fff">Meet at 6?</text></g>
    <rect x="65" y="398" width="60" height="4" rx="2" fill="#d1d1d6"/>
  </g></g>
  <g transform="translate(925,566)"><circle class="k" r="22" fill="none" stroke="#2fa36b" stroke-width="3"/><circle r="22" fill="#2fa36b"/><use href="#key" x="2" y="0"/></g>
  <text x="925" y="610" text-anchor="middle" font-size="14" fill="#6e6e73">Mia's key</text>

  <g class="f2"><g transform="translate(1030,196) rotate(4 95 210)" filter="url(#shadow)">
    <rect width="190" height="420" rx="40" fill="#f2f2f7" stroke="#d1d1d6" stroke-width="4"/>
    <rect x="10" y="10" width="170" height="400" rx="31" fill="#ffffff"/>
    <rect x="65" y="22" width="60" height="16" rx="8" fill="#1d1d1f"/>
    <text x="95" y="72" text-anchor="middle" font-size="14" fill="#6e6e73">Mia</text>
    <g class="b b3"><rect x="92" y="90" width="78" height="32" rx="16" fill="#1a8cff"/><text x="131" y="111" text-anchor="middle" font-size="13" fill="#fff">Dinner?</text></g>
    <rect x="65" y="398" width="60" height="4" rx="2" fill="#d1d1d6"/>
  </g></g>
  <g transform="translate(1125,150)"><circle class="k" style="animation-delay:1.5s" r="22" fill="none" stroke="#2fa36b" stroke-width="3"/><circle r="22" fill="#2fa36b"/><use href="#key" x="2" y="0"/></g>
  <text x="1125" y="116" text-anchor="middle" font-size="14" fill="#6e6e73">Sam's key</text>
</svg>
